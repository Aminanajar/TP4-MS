server:
  port: 8888
spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          # Envoi des en-têtes X-Forwarded-* aux microservices
          trusted-proxies: '.*'

          x-forwarded:
            enabled: true
            host-enabled: true
            port-enabled: true
            prefix-enabled: true

          # Routes dynamiques depuis l'annuaire Eureka
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

    loadbalancer:
      cache:
        ttl: 5s

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    registry-fetch-interval-seconds: 5

  instance:
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

management:
  endpoints:
    web:
      exposure:
        include: gateway,health

  endpoint:
    gateway:
      access: unrestricted

springdoc:
  swagger-ui:
    urls:
      - name: calcul-service
        url: /calcul-service/v3/api-docs

      - name: historique-service
        url: /historique-service/v3/api-docs